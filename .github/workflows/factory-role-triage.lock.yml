                  "temporary_id": {
                    "type": "string",
                    "pattern": "^#?aw_[A-Za-z0-9_]{3,12}$"
                  }
                }
              },
              "add_labels": {
                "defaultMax": 5,
                "fields": {
                  "item_number": {
                    "issueNumberOrTemporaryId": true
                  },
                  "labels": {
                    "required": true,
                    "type": "array"
                  },
                  "repo": {
                    "type": "string",
                    "maxLength": 256
                  }
                }
              },
              "close_issue": {
                "defaultMax": 1,
                "fields": {
                  "body": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  },
                  "confidence": {
                    "type": "string",
                    "enum": [
                      "LOW",
                      "MEDIUM",
                      "HIGH"
                    ],
                    "x-strip-on-error": true
                  },
                  "duplicate_of": {
                    "issueOrPRNumber": true
                  },
                  "issue_number": {
                    "optionalPositiveInteger": true
                  },
                  "rationale": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 280,
                    "x-strip-on-error": true
                  },
                  "repo": {
                    "type": "string",
                    "maxLength": 256
                  },
                  "state_reason": {
                    "type": "string",
                    "enum": [
                      "completed",
